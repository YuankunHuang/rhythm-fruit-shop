<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style 04 - Retro Pixel Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20133a;color:#fff;font-family:"Courier New",monospace;image-rendering:pixelated}.screen{min-height:100vh;padding:24px;background:linear-gradient(#20133a,#0b1024);display:grid;grid-template-columns:320px 1fr 300px;gap:18px}.box{background:#2d1b55;border:4px solid #ffd166;box-shadow:8px 8px 0 #000;padding:18px}.logo{font-size:34px;line-height:1.1;color:#6dffb8;text-shadow:4px 4px 0 #000}.btn{display:block;width:100%;margin:12px 0;padding:14px;background:#ff5d8f;border:4px solid #fff;color:#fff;font-weight:bold;box-shadow:5px 5px 0 #000}.songs{display:grid;gap:10px}.song{padding:12px;border:3px solid #7bdff2;background:#12091f}.song.active{background:#ff5d8f;color:#fff}.game{position:relative;min-height:620px;background:#12091f;border:4px solid #7bdff2;overflow:hidden}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff08 4px 6px);pointer-events:none}.hud{position:absolute;left:18px;top:18px;border:3px solid #ffd166;background:#20133a;padding:10px;color:#ffd166;font-weight:bold}.lane{position:absolute;left:50%;top:90px;bottom:88px;width:300px;transform:translateX(-50%);border:4px solid #6dffb8;background:#17284b}.hit{position:absolute;left:22%;right:22%;bottom:112px;height:18px;background:#ffd166;box-shadow:0 0 0 4px #000}.note{position:absolute;width:50px;height:50px;background:#ff5d8f;border:4px solid #fff;box-shadow:5px 5px 0 #000}.n1{left:48%;top:135px}.n2{left:39%;top:270px;background:#ffd166}.n3{left:57%;top:390px;background:#6dffb8}.order h2{color:#ffd166}.bar{height:20px;border:4px solid #fff;background:#000}.bar i{display:block;height:100%;width:70%;background:#6dffb8}.coin{font-size:42px;color:#ffd166;text-shadow:4px 4px 0 #000}@media(max-width:980px){.screen{grid-template-columns:1fr}.game{min-height:520px}}
</style>
</head>
<body>
<main class="screen">
<section class="box"><h1 class="logo">RHYTHM<br>FRUIT<br>ARCADE</h1><p>街机复古风：更游戏、更硬核、更适合挑战型玩家。</p><button class="btn">INSERT SHIFT</button><button class="btn" style="background:#6dffb8;color:#20133a">OPTIONS</button></section>
<section class="game"><div class="hud">SCORE 088800<br>COMBO 64<br>SPEED 2</div><div class="lane"></div><div class="note n1"></div><div class="note n2"></div><div class="note n3"></div><div class="hit"></div><div class="scan"></div></section>
<aside class="box order"><h2>ORDER QUEST</h2><div class="songs"><div class="song active">Pixel Apple / Easy</div><div class="song">Soda Boss / Hard</div><div class="song">Night Market EX</div></div><p>JUICE 7/10</p><div class="bar"><i></i></div><p class="coin">+250G</p></aside>
</main>
</body>
</html>
