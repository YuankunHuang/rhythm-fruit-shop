<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style 06 - Clean Modern Mobile</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 0 1px #e7edf5,0 20px 80px #0f172a22;display:grid;grid-template-rows:auto 1fr auto}.top{padding:22px 20px 12px}.top h1{margin:0;font-size:32px}.top p{color:#64748b;line-height:1.5}.seg{display:flex;gap:6px;background:#f1f5f9;padding:5px;border-radius:999px}.seg span{flex:1;text-align:center;padding:8px;border-radius:999px;font-weight:900;color:#64748b}.seg .on{background:#fff;color:#10b981;box-shadow:0 4px 16px #0f172a12}.game{position:relative;margin:12px 16px;border-radius:32px;background:linear-gradient(#e9fff4,#f8fbff);overflow:hidden;border:1px solid #e7edf5;min-height:560px}.hud{position:absolute;left:16px;right:16px;top:16px;display:flex;justify-content:space-between;align-items:center;background:#ffffffd9;border:1px solid #e7edf5;border-radius:22px;padding:12px 14px;font-weight:950}.lane{position:absolute;left:50%;top:98px;bottom:92px;width:280px;transform:translateX(-50%);border-radius:28px;background:#fff;border:1px solid #e7edf5}.note{position:absolute;width:56px;height:56px;border-radius:18px;background:#fb7185;border:5px solid #fff;box-shadow:0 12px 28px #fb718533}.n1{left:48%;top:150px}.n2{left:38%;top:285px;background:#fbbf24}.n3{left:56%;top:405px;background:#34d399}.hit{position:absolute;left:36px;right:36px;bottom:112px;height:12px;background:#10b981;border-radius:999px}.thumb{position:absolute;left:48px;right:48px;bottom:24px;padding:16px;border-radius:999px;background:#172033;color:#fff;text-align:center;font-weight:950}.bottom{padding:14px 18px 24px}.order{background:#f8fafc;border:1px solid #e7edf5;border-radius:24px;padding:16px}.bar{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden}.bar i{display:block;width:76%;height:100%;background:#10b981}
</style>
</head>
<body>
<main class="phone">
<section class="top"><h1>鲜果节奏</h1><p>极简移动端方案：信息少、按钮少、触控区域明确，适合真正面向手机分享。</p><div class="seg"><span>Easy</span><span class="on">Normal</span><span>Hard</span><span>EX</span></div></section>
<section class="game"><div class="hud"><span>0123456</span><span style="color:#10b981">88 COMBO</span></div><div class="lane"></div><div class="note n1"></div><div class="note n2"></div><div class="note n3"></div><div class="hit"></div><div class="thumb">点按 / 长按</div></section>
<section class="bottom"><div class="order"><b>当前订单：鲜果杯</b><p>完成 8/10</p><div class="bar"><i></i></div></div></section>
</main>
</body>
</html>
