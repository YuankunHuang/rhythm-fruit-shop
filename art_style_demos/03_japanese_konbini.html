<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style 03 - Japanese Konbini</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2a37;font-family:Inter,"Noto Sans SC",system-ui,sans-serif}.wrap{min-height:100vh;padding:26px;display:grid;grid-template-columns:340px 1fr;gap:22px}.panel{background:#fff;border:1px solid #d9e2ef;border-radius:26px;padding:22px;box-shadow:0 18px 45px #243b5320}.sign{background:linear-gradient(90deg,#22c55e 0 33%,#fff 33% 66%,#38bdf8 66%);height:18px;border-radius:999px;margin-bottom:18px}.title{font-size:44px;font-weight:1000;margin:0}.muted{color:#64748b;line-height:1.7}.actions{display:flex;gap:10px;margin-top:20px}.actions button{border:0;border-radius:14px;padding:13px 18px;background:#22c55e;color:#fff;font-weight:900}.actions button:last-child{background:#e2e8f0;color:#1f2a37}.main{display:grid;grid-template-columns:1fr 310px;gap:20px}.game{position:relative;height:620px;background:linear-gradient(#eaf5ff,#fff);border-radius:28px;overflow:hidden;border:1px solid #d9e2ef}.awning{position:absolute;left:0;right:0;top:0;height:54px;background:repeating-linear-gradient(90deg,#22c55e 0 45px,#fff 45px 90px,#38bdf8 90px 135px,#fff 135px 180px)}.hud{position:absolute;left:22px;top:76px;background:#fff;border:1px solid #d9e2ef;border-radius:18px;padding:12px 16px;font-weight:900}.lane{position:absolute;left:50%;top:120px;bottom:90px;width:320px;transform:translateX(-50%);background:#ffffffd9;border:1px solid #d9e2ef;border-radius:28px}.line{position:absolute;left:20%;right:20%;bottom:118px;height:14px;border-radius:999px;background:#ef4444;box-shadow:0 0 18px #ef444455}.fruit{position:absolute;width:58px;height:58px;border-radius:50%;background:#f97316;border:5px solid #fff;box-shadow:0 12px 26px #64748b33}.a{left:47%;top:150px}.b{left:41%;top:275px;background:#22c55e}.c{left:56%;top:410px;background:#eab308}.receipt{display:grid;gap:14px}.item{background:#fff;border:1px solid #d9e2ef;border-radius:20px;padding:16px}.item strong{display:block;font-size:20px}.bar{height:12px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;width:78%;background:#22c55e}.songs{margin-top:16px;display:grid;gap:10px}.song{padding:13px;border-radius:16px;background:#f8fafc;border:1px solid #d9e2ef}.song.active{border-color:#22c55e;background:#ecfdf5}@media(max-width:1000px){.wrap,.main{grid-template-columns:1fr}.game{height:520px}}
</style>
</head>
<body>
<main class="wrap">
<section class="panel"><div class="sign"></div><h1 class="title">便利店鲜果吧</h1><p class="muted">干净、秩序、轻商业感。适合强调“打工经营”“班次结算”的版本，UI 像收银系统但保留可爱水果。</p><div class="actions"><button>上班打卡</button><button>选曲</button></div><div class="songs"><div class="song active">Morning Shelf / Easy</div><div class="song">School Rush / Normal</div><div class="song">Late Shift / Hard</div></div></section>
<section class="main"><div class="game"><div class="awning"></div><div class="hud">SCORE 0182450<br>COMBO 96</div><div class="lane"></div><div class="fruit a"></div><div class="fruit b"></div><div class="fruit c"></div><div class="line"></div></div><aside class="receipt"><div class="item"><strong>订单 #032</strong><p>青柠苏打 6/8</p><div class="bar"><i></i></div></div><div class="item"><strong>顾客评价</strong><p>“速度很快，包装也很整洁。”</p></div><div class="item"><strong>本班收入</strong><p style="font-size:34px;font-weight:1000;color:#22c55e">+320</p></div></aside></section>
</main>
</body>
</html>
