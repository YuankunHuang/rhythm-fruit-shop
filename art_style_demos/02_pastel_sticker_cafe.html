<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style 02 - Pastel Sticker Cafe</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Nunito",Inter,system-ui,sans-serif;background:#fdf4ff;color:#4b3b5a;background-image:radial-gradient(#ffc7dd 2px,transparent 2px),radial-gradient(#b8f7d4 2px,transparent 2px);background-size:34px 34px;background-position:0 0,17px 17px}.app{min-height:100vh;padding:30px;display:grid;gap:20px;grid-template-columns:360px 1fr 320px}.card{background:#fff;border:4px solid #4b3b5a;border-radius:30px;padding:22px;box-shadow:8px 8px 0 #4b3b5a22}.logo{font-size:42px;line-height:1.05;font-weight:1000;color:#ff78ad}.tag{display:inline-block;background:#fff3a6;border:3px solid #4b3b5a;border-radius:999px;padding:7px 12px;font-weight:1000}.btn{display:block;width:100%;border:3px solid #4b3b5a;border-radius:20px;padding:14px;margin-top:12px;background:#a8f0c6;font-weight:1000;color:#4b3b5a;box-shadow:4px 4px 0 #4b3b5a}.list{display:grid;gap:12px}.song{border:3px solid #4b3b5a;border-radius:22px;padding:14px;background:#fff}.song:nth-child(2){background:#fff3a6}.song:nth-child(3){background:#c9e8ff}.song.active{background:#ffc7dd}.game{position:relative;min-height:620px;border:4px solid #4b3b5a;border-radius:34px;background:linear-gradient(#dff7ff,#fff);overflow:hidden}.top{position:absolute;left:20px;right:20px;top:20px;display:flex;justify-content:space-between;gap:10px}.pill{background:#fff;border:3px solid #4b3b5a;border-radius:999px;padding:10px 16px;font-weight:1000}.lane{position:absolute;left:50%;top:100px;bottom:100px;width:300px;transform:translateX(-50%);background:#ffffffaa;border:3px dashed #4b3b5a;border-radius:26px}.note{position:absolute;width:60px;height:60px;border:4px solid #4b3b5a;border-radius:22px;background:#ff78ad;box-shadow:5px 5px 0 #4b3b5a22}.n1{left:50%;top:150px}.n2{left:43%;top:285px;background:#fff3a6}.n3{left:55%;top:410px;background:#a8f0c6}.hit{position:absolute;left:22%;right:22%;bottom:120px;height:20px;background:#ff78ad;border:3px solid #4b3b5a;border-radius:999px}.order b{font-size:24px}.meter{height:18px;border:3px solid #4b3b5a;border-radius:999px;overflow:hidden;background:#fff}.meter i{display:block;height:100%;width:65%;background:#ff78ad}@media(max-width:1000px){.app{grid-template-columns:1fr}.game{min-height:520px}}
</style>
</head>
<body>
<main class="app">
<section class="card"><span class="tag">贴纸咖啡店</span><h1 class="logo">Fruit Pop<br>Rhythm</h1><p>像手账贴纸和儿童杂志一样轻松，按钮都很大，适合偏休闲和可爱用户。</p><button class="btn">开始营业</button><button class="btn" style="background:#c9e8ff">换装店铺</button></section>
<section class="game"><div class="top"><div class="pill">SCORE 234560</div><div class="pill">速度 2</div><div class="pill">128 COMBO</div></div><div class="lane"></div><div class="note n1"></div><div class="note n2"></div><div class="note n3"></div><div class="hit"></div></section>
<aside class="card order"><b>订单贴纸板</b><p>鲜果杯 7/10</p><div class="meter"><i></i></div><p>顾客：太可爱了，再来一杯！</p><div class="list"><div class="song active">Sweet Day / Easy</div><div class="song">Berry Walk / Normal</div><div class="song">Sugar Rush / Hard</div></div></aside>
</main>
</body>
</html>
