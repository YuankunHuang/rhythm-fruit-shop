<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Style 01 - Sunny Fruit Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",Arial,sans-serif;background:linear-gradient(160deg,#fff7d8,#dfffe8 55%,#c8f1ff);color:#253044}button{border:0;border-radius:999px;padding:13px 22px;font-weight:950;background:linear-gradient(135deg,#ff8aa6,#ffd56d);color:#3a2430;box-shadow:0 12px 24px #ffb86c55}.wrap{min-height:100vh;padding:28px;display:grid;gap:22px;grid-template-columns:1.05fr .95fr}.panel{border:3px solid #fff;background:#ffffffbb;border-radius:34px;padding:24px;box-shadow:0 20px 60px #7fc7a533;backdrop-filter:blur(10px)}.hero{display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 18% 15%,#fff 0 16%,transparent 17%),linear-gradient(145deg,#fff9c9,#b9ffd1)}.eyebrow{font-size:13px;letter-spacing:.16em;font-weight:950;color:#27b676}.title{font-size:54px;line-height:1;margin:10px 0;color:#ff7094;text-shadow:3px 4px 0 #fff}.subtitle{font-size:18px;line-height:1.65;color:#52606f}.actions{display:flex;gap:12px;flex-wrap:wrap}.ghost{background:#fff;color:#26a96c;border:2px solid #a6efbd}.songs{display:grid;gap:12px}.song{padding:16px;border-radius:22px;background:#fff;border:2px solid #ffefb1}.song.active{border-color:#ff8aa6;box-shadow:0 0 0 5px #ff8aa633}.song b{display:block;font-size:19px;color:#253044}.meta{color:#738096;font-weight:700;margin-top:5px}.play{grid-column:1/3;display:grid;grid-template-columns:1fr 420px;gap:22px}.stage{height:500px;border-radius:36px;background:linear-gradient(#fff6bd,#b7f8cf);position:relative;overflow:hidden;border:4px solid #fff}.lane{position:absolute;left:50%;top:70px;bottom:80px;width:330px;transform:translateX(-50%);border-radius:28px;background:#ffffff88;border:3px dashed #ffce61}.hit{position:absolute;left:calc(50% - 200px);right:calc(50% - 200px);bottom:110px;height:16px;border-radius:999px;background:#ff8aa6;box-shadow:0 0 25px #ff8aa6}.fruit{position:absolute;border-radius:50%;width:58px;height:58px;background:#ff6f8d;border:5px solid #fff;box-shadow:0 10px 0 #0001}.f1{left:48%;top:120px}.f2{left:39%;top:230px;background:#ffd56d}.f3{left:55%;top:315px;background:#74df8f}.hud{position:absolute;left:24px;top:22px;background:#fff;padding:14px 18px;border-radius:22px;font-weight:950;color:#ff7094}.order{display:grid;gap:14px}.ticket{border-radius:28px;background:#fff;padding:20px;border:3px solid #ffefb1}.bar{height:16px;border-radius:999px;background:#edf4f0;overflow:hidden}.bar i{display:block;height:100%;width:72%;background:#74df8f}.stamp{font-size:46px;font-weight:950;color:#ff8aa6}@media(max-width:900px){.wrap,.play{grid-template-columns:1fr}.play{grid-column:auto}.title{font-size:40px}.stage{height:460px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="panel hero"><div><div class="eyebrow">SUNNY FRUIT SHOP</div><h1 class="title">节奏鲜果铺</h1><p class="subtitle">默认主视觉方案：明亮、青春、可爱、亲和。适合日间经营和新手第一印象。</p></div><div class="actions"><button>开门营业</button><button class="ghost">今日菜单</button></div></section>
  <section class="panel songs"><div class="song active"><b>Drama Pop</b><div class="meta">日间 / Easy / 128 BPM</div></div><div class="song"><b>Fruit Rush</b><div class="meta">黄昏 / Normal / 145 BPM</div></div><div class="song"><b>Sweet Market</b><div class="meta">夜市 / Hard / 168 BPM</div></div></section>
  <section class="play"><div class="stage"><div class="hud">SCORE 0123456<br>COMBO 128</div><div class="lane"></div><div class="fruit f1"></div><div class="fruit f2"></div><div class="fruit f3"></div><div class="hit"></div></div><aside class="order"><div class="ticket"><b>鲜果杯订单</b><p>顾客满意度</p><div class="bar"><i></i></div></div><div class="ticket"><div class="stamp">A+</div><p>完成 3/4 单，入账 +280</p></div></aside></section>
</main>
</body>
</html>
