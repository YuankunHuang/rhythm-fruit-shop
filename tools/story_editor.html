<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>剧情编辑器</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --card: #ffffff;
        --ink: #2b2f36;
        --muted: #7a7f88;
        --line: #e4ded2;
        --accent: #3f9f65;
        --warn: #c9822b;
        --bad: #c94b5b;
        --dialogue: #6d8fd1;
        --service: #3f9f65;
        --select: #d18a3f;
        --branch: #a46dd1;
        --track: #d14f84;
        --end: #8a8f98;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 system-ui,
          'Microsoft YaHei',
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        background: #fffdf8;
        border-bottom: 1px solid var(--line);
      }
      header h1 {
        margin: 0 8px 0 0;
        font-size: 16px;
      }
      #status {
        color: var(--muted);
        margin-left: auto;
      }
      #status.dirty {
        color: var(--warn);
        font-weight: 600;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.icon {
        padding: 0 7px;
        color: var(--muted);
      }
      input,
      select,
      textarea {
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 3px 6px;
        background: #fff;
      }
      textarea {
        width: 100%;
        resize: none;
        overflow: hidden;
        min-height: 30px;
      }
      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
        max-width: 1280px;
        margin: 0 auto;
      }
      nav {
        position: sticky;
        top: 64px;
        align-self: start;
        max-height: calc(100vh - 80px);
        overflow: auto;
        font-size: 13px;
      }
      nav a {
        display: block;
        padding: 2px 6px;
        border-radius: 4px;
        color: inherit;
        text-decoration: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      nav a:hover {
        background: #fff;
      }
      nav .tag {
        display: inline-block;
        width: 4.5em;
        color: var(--muted);
      }
      #issues {
        margin-bottom: 12px;
      }
      #issues div {
        padding: 4px 10px;
        border-left: 3px solid var(--warn);
        background: #fff8ec;
        margin-bottom: 3px;
        cursor: pointer;
      }
      #issues div.error {
        border-color: var(--bad);
        background: #fdf0f2;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 5px solid var(--c, var(--end));
        border-radius: 8px;
        margin-bottom: 12px;
        padding: 10px 12px;
      }
      .card-head {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .badge {
        font-weight: 700;
        color: var(--c);
        min-width: 4.5em;
      }
      .card-head .id {
        width: 14em;
        color: var(--muted);
      }
      .card-head .spacer {
        flex: 1;
      }
      .fields {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 14px;
        margin: 4px 0 8px;
      }
      .fields label {
        display: flex;
        gap: 5px;
        align-items: center;
        color: var(--muted);
      }
      .fields label > * {
        color: var(--ink);
      }
      .section-title {
        margin: 8px 0 4px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.05em;
      }
      .line {
        display: grid;
        grid-template-columns: 7em minmax(0, 1fr) 6.5em auto;
        gap: 6px;
        align-items: start;
        margin-bottom: 4px;
      }
      .line .tools {
        display: flex;
        gap: 2px;
        white-space: nowrap;
      }
      .line.narration textarea {
        color: #5b6170;
        font-style: italic;
      }
      .line.action textarea {
        background: #f3f7f4;
      }
      .branch {
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        margin: 6px 0;
      }
      .branch.styled {
        border-color: var(--branch);
        background: #fbf7ff;
      }
      .add-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .options td {
        padding: 2px 4px;
      }
      #read {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px 24px;
        white-space: pre-wrap;
        line-height: 1.8;
      }
      .hidden {
        display: none !important;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
        nav {
          position: static;
          max-height: 200px;
        }
        .line {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>剧情编辑器</h1>
      <select id="file" aria-label="选择文件"></select>
      <button id="modeButton">阅读模式</button>
      <button id="saveButton" class="primary">保存 (Ctrl+S)</button>
      <a href="../index.html" target="_blank">在游戏里看 ↗</a>
      <span id="status">加载中…</span>
    </header>
    <main>
      <nav id="outline"></nav>
      <section>
        <div id="issues"></div>
        <div id="doc"></div>
        <div id="read" class="hidden"></div>
      </section>
    </main>
    <datalist id="speakers"></datalist>
    <datalist id="exprs"></datalist>
    <script type="module" src="story_editor.js"></script>
  </body>
</html>
